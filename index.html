<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No Time — покерный тренажёр</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#12151a; --panel:#1a1f27; --panel2:#222935; --line:#2e3744;
  --text:#e8ecf1; --muted:#95a2b3;
  --push:#6b3bb0; --raise:#e0574c; --fold:#6d7684; --call:#2a8f9e;
  --reg:#8a9a2e; --fish:#e08a2a;
  --accent:#3fa96b; --felt:#1d3b31; --feltline:#2f5b4a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
 padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 32px}
h1{font-size:19px;margin:2px 0}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:11px}
.menu-item{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
 border-radius:11px;padding:14px;margin-bottom:9px;cursor:pointer;color:var(--text);font:inherit}
.menu-item:active{background:var(--panel2)}
.menu-item .t{font-size:16px;font-weight:600;margin-bottom:3px}
.menu-item .d{font-size:12.5px;color:var(--muted)}
.menu-item .m{font-size:11.5px;color:var(--accent);margin-top:5px}
button,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);
 border-radius:9px;padding:9px 12px;cursor:pointer}
select{width:100%;max-width:100%}
label.f{font-size:11.5px;color:var(--muted);display:block;margin:0 0 5px;text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);
 font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.topbar{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.back{padding:6px 11px;font-size:13px}
.spotline{font-size:12.5px;color:var(--muted);text-align:center;margin:2px 0 6px}
svg{width:100%;height:auto;display:block;max-width:520px;margin:0 auto}
.hand-cards{display:flex;gap:7px;justify-content:center;margin:6px 0}
.pc{width:52px;height:72px;border-radius:7px;background:#f4f6f8;color:#111;display:flex;
 flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1}
.pc .r{font-size:26px}
.pc .s{font-size:20px;margin-top:2px}
.red{color:#c8322a}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;padding:14px 4px;font-size:14.5px;font-weight:600;border-radius:10px;border:none}
.b-fold{background:#39414e}
.b-call{background:#20707c}
.b-raise{background:#a33f37}
.b-push{background:#553093}
.b-next{background:var(--accent);color:#fff}
.verdict{margin-top:11px;padding:11px 13px;border-radius:9px;font-size:14px}
.verdict.ok{background:rgba(63,169,107,.14);border:1px solid rgba(63,169,107,.5)}
.verdict.no{background:rgba(214,73,60,.14);border:1px solid rgba(214,73,60,.5)}
.grid{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;margin-top:10px}
.g{aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;
 font-size:8px;font-weight:600;color:#fff;overflow:hidden}
.g.me{outline:2.5px solid #fff;outline-offset:-1px}
.legend{display:flex;gap:11px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
table.stat{width:100%;border-collapse:collapse;font-size:13px}
table.stat td,table.stat th{border-bottom:1px solid var(--line);padding:5px 3px;text-align:left}
td.n,th.n{text-align:right}
.big{font-size:25px;font-weight:700}
.muted{color:var(--muted);font-size:12.5px}
.note{font-size:12px;color:var(--muted);margin-top:7px}
.hidden{display:none}
summary{cursor:pointer;color:var(--muted);font-size:13px}
@media(max-width:400px){ .pc{width:46px;height:64px} .pc .r{font-size:23px} .acts button{font-size:13.5px;padding:13px 2px} .g{font-size:7px} }
</style>
</head>

const RANKS="AKQJT98765432";
const SEATS=["EP","MP","LJ","HJ","CO","BTN","SB","BB"];
const PF_SEATS=["UTG","MP","HJ","CO","BTN","SB","BB"];
const SUITS=[["♠",0],["♥",1],["♦",1],["♣",0]];

const MODES={
  pushfold:{title:"Пуш-фолд, первым в банк",
    desc:"До тебя все сфолдили. Стек 12bb. Классика и PKO.",
    groupBy:"model"},
  bbdef:{title:"Защита большого блайнда",
    desc:"Против открытия с разных позиций. Стеки 25–40bb.",
    groupBy:"model"},
  sbdef:{title:"Защита малого блайнда",
    desc:"Против открытия. Стеки 25 и 40bb, ChipEV и ICM.",
    groupBy:"model"},
  vsopen:{title:"Ре-стил в позиции",
    desc:"BTN, CO, HJ, LJ, MP против открытия раньше. Стек 30bb.",
    groupBy:"hero"}
};
const ALABEL={F:"Фолд",C:"Колл",R:"3-бет",P:"Олл-ин"};
const ACLS={F:"b-fold",C:"b-call",R:"b-raise",P:"b-push"};

let stats=load(), mode=null, pool=[], filters={}, state=null;

function load(){ try{const s=localStorage.getItem("notime");if(s)return JSON.parse(s);}catch(e){} return {n:0,ok:0,by:{},mode:{}}; }
function save(){ try{localStorage.setItem("notime",JSON.stringify(stats));}catch(e){} cloudSave(stats); }

function keysOf(m){ return Object.keys(CH).filter(k=>CH[k].mode===m); }
function ri(n){ return Math.floor(Math.random()*n); }
function handName(i,j){ return i===j?RANKS[i]+RANKS[i]:(i<j?RANKS[i]+RANKS[j]+"s":RANKS[j]+RANKS[i]+"o"); }
function pair(k,i,j){ const g=CH[k].g, p=(i*13+j)*2; return [g[p],g[p+1]]; }

function expand(letters,opp){
  const out=new Set();
  letters.forEach(L=>{
    if(L==="K") out.add(opp==="fish"?"C":"F");
    else if(L==="G") out.add(opp==="reg"?"F":"C");
    else out.add(L);
  });
  return [...out];
}
function chartHasCond(k){ return CH[k].g.indexOf("G")>=0 || CH[k].g.indexOf("K")>=0; }
function buttonsFor(k){
  const g=CH[k].g, s=new Set(["F"]);
  if(g.indexOf("C")>=0||g.indexOf("G")>=0||g.indexOf("K")>=0) s.add("C");
  if(g.indexOf("R")>=0) s.add("R");
  if(g.indexOf("P")>=0) s.add("P");
  return ["F","C","R","P"].filter(x=>s.has(x));
}
function raiseLabel(k){ return CH[k].mode==="pushfold" ? "Рейз 2bb" : "3-бет"; }

/* ---------- screens ---------- */
function show(id){
  ["menu","setup","play"].forEach(s=>document.getElementById("screen-"+s).classList.toggle("hidden",s!==id));
  window.scrollTo(0,0);
}
function drawMenu(){
  const box=document.getElementById("menuList");
  box.innerHTML=Object.entries(MODES).map(([m,v])=>{
    const n=keysOf(m).length;
    const st=stats.mode[m];
    const line = st&&st.n ? `${Math.round(100*st.ok/st.n)}% · ${st.n} рук` : "ещё не тренировался";
    return `<button class="menu-item" data-m="${m}"><div class="t">${v.title}</div>
      <div class="d">${v.desc}</div><div class="m">${n} чартов · ${line}</div></button>`;
  }).join("");
  [...box.children].forEach(b=>b.onclick=()=>openSetup(b.dataset.m));
  const acc = stats.n? Math.round(100*stats.ok/stats.n)+"%" : "—";
  document.getElementById("totAcc").textContent=acc;
  document.getElementById("totN").textContent=stats.n;
  let h=`<tr><th>Режим</th><th class="n">Рук</th><th class="n">Точность</th></tr>`;
  Object.entries(MODES).forEach(([m,v])=>{
    const s=stats.mode[m]; if(!s||!s.n) return;
    h+=`<tr><td>${v.title}</td><td class="n">${s.n}</td><td class="n">${Math.round(100*s.ok/s.n)}%</td></tr>`;
  });
  document.getElementById("modeStat").innerHTML=h;
}

function openSetup(m){
  mode=m; filters={models:null,pos:null};
  document.getElementById("setupTitle").textContent=MODES[m].title;
  const ks=keysOf(m);
  const models=[...new Set(ks.map(k=>CH[k].model))];
  const posKey = m==="pushfold" ? "hero" : "vs";
  const poss=[...new Set(ks.map(k=>CH[k][posKey]))];
  filters.models=new Set(models); filters.pos=new Set(poss);
  const posTitle = m==="pushfold"?"Твоя позиция":(m==="vsopen"?"Кто открыл":"Позиция открывшего");
  let h=`<label class="f">Настройка чартов</label><div class="chips" id="mChips">`;
  h+=models.map(x=>`<div class="chip on" data-x="${x}">${x}</div>`).join("");
  h+=`</div><div style="height:12px"></div><label class="f">${posTitle}</label><div class="chips" id="pChips">`;
  h+=poss.map(x=>`<div class="chip on" data-x="${x}">${x}</div>`).join("")+`</div>`;
  if(m==="vsopen"){
    const heroes=[...new Set(ks.map(k=>CH[k].hero))];
    filters.hero=new Set(heroes);
    h+=`<div style="height:12px"></div><label class="f">Твоя позиция</label><div class="chips" id="hChips">`;
    h+=heroes.map(x=>`<div class="chip on" data-x="${x}">${x}</div>`).join("")+`</div>`;
  }
  document.getElementById("setupBody").innerHTML=h;
  bindChips("mChips",filters.models); bindChips("pChips",filters.pos);
  if(m==="vsopen") bindChips("hChips",filters.hero);
  show("setup");
}
function bindChips(id,set){
  const box=document.getElementById(id); if(!box) return;
  [...box.children].forEach(c=>c.onclick=()=>{
    const x=c.dataset.x;
    if(set.has(x)&&set.size>1){ set.delete(x); c.classList.remove("on"); }
    else { set.add(x); c.classList.add("on"); }
  });
}
function buildPool(){
  const posKey = mode==="pushfold" ? "hero" : "vs";
  pool=keysOf(mode).filter(k=>filters.models.has(CH[k].model)&&filters.pos.has(CH[k][posKey])
    &&(mode!=="vsopen"||filters.hero.has(CH[k].hero)));
  if(!pool.length) pool=keysOf(mode);
}

/* ---------- spot ---------- */
function newSpot(){
  const k=pool[ri(pool.length)];
  const i=ri(13), j=ri(13);
  let c1,c2;
  if(i===j){ const s=[...SUITS].sort(()=>Math.random()-.5); c1=[RANKS[i],s[0]]; c2=[RANKS[i],s[1]]; }
  else if(i<j){ const s=SUITS[ri(4)]; c1=[RANKS[i],s]; c2=[RANKS[j],s]; }
  else { const s=[...SUITS].sort(()=>Math.random()-.5); c1=[RANKS[j],s[0]]; c2=[RANKS[i],s[1]]; }
  const opp = chartHasCond(k) ? (Math.random()<.5?"reg":"fish") : null;
  const seedStacks={};
  state={k,i,j,c1,c2,opp,seedStacks,answered:false};
  renderPlay();
}
function renderPlay(){
  const m=CH[state.k];
  document.getElementById("playTitle").textContent=MODES[mode].title;
  let line = m.mode==="pushfold"
    ? `${m.hero} · ${m.stack}bb · до тебя все сфолдили · ${m.model}`
    : `${m.hero} vs ${m.vs} · ${m.stack}bb · ${m.model}`;
  if(state.opp) line += ` · оппонент: ${state.opp==="reg"?"сильный рег":"любитель"}`;
  document.getElementById("spotline").textContent=line;
  drawTable();
  document.getElementById("cards").innerHTML=[state.c1,state.c2].map(c=>
    `<div class="pc"><div class="r ${c[1][1]?'red':''}">${c[0]}</div><div class="s ${c[1][1]?'red':''}">${c[1][0]}</div></div>`).join("");
  const btns=buttonsFor(state.k);
  document.getElementById("acts").innerHTML=btns.map((b,n)=>
    `<button class="${ACLS[b]}" data-a="${b}">${b==="R"?raiseLabel(state.k):ALABEL[b]}</button>`).join("");
  [...document.getElementById("acts").children].forEach(b=>b.onclick=()=>answer(b.dataset.a));
  const v=document.getElementById("verdict"); v.innerHTML=""; v.className="";
  document.getElementById("gridBox").classList.add("hidden");
  drawStats();
}
function stackFor(seat){
  if(!(seat in state.seedStacks)) state.seedStacks[seat]=CH[state.k].stack+ri(21)-6;
  return Math.max(6,state.seedStacks[seat]);
}
function drawTable(){
  const m=CH[state.k];
  const seats = m.mode==="pushfold" ? PF_SEATS.slice() : SEATS.slice();
  const heroName = m.hero==="UTG"&&seats.indexOf("UTG")<0 ? "EP" : m.hero;
  let hi=seats.indexOf(heroName);
  if(hi<0){ seats[0]=m.hero; hi=0; }
  let oi=-1;
  if(m.vs){ let vn=m.vs; if(seats.indexOf(vn)<0){ seats[0]=vn; } oi=seats.indexOf(vn); }
  const cx=260,cy=160,rx=200,ry=112,n=seats.length;
  let s=`<svg viewBox="0 0 520 320" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx-16}" ry="${ry-16}" fill="var(--felt)" stroke="var(--feltline)" stroke-width="3"/>`;
  s+=`<text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="12.5" fill="#8fae9e">блайнды 0.5 / 1 + анте</text>`;
  for(let k2=0;k2<n;k2++){
    const ang=Math.PI/2+(k2-hi)*(2*Math.PI/n);
    const x=cx+rx*Math.cos(ang), y=cy+ry*Math.sin(ang);
    const seat=seats[k2], hero=(k2===hi), opener=(k2===oi);
    let sub, fill="#262c36", stroke="#39414e", col="#c3ccd8";
    if(hero){ sub=m.stack+" bb"; fill="#2a4a3c"; stroke="#4fbf86"; col="#8fe3b7"; }
    else if(opener){ sub="рейз "+(m.raise_sz||"2bb"); fill="#3a2f24"; stroke="#c9962e"; col="#e5c176"; }
    else if(m.mode==="pushfold" ? k2<hi : (k2<hi&&k2!==oi)||(oi>=0&&k2<oi)){ sub="фолд"; fill="#20242b"; stroke="#2b313b"; col="#5b6472"; }
    else sub=stackFor(seat)+" bb";
    s+=`<rect x="${x-42}" y="${y-21}" width="84" height="42" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="${hero||opener?2.1:1.2}"/>`;
    s+=`<text x="${x}" y="${y-4}" text-anchor="middle" font-size="12" font-weight="600" fill="${col}">${seat}</text>`;
    s+=`<text x="${x}" y="${y+11}" text-anchor="middle" font-size="11.5" fill="${sub==="фолд"?"#4d5563":"#96a3b4"}">${sub}</text>`;
    if(m.pko && !hero && sub!=="фолд"){
      s+=`<circle cx="${x+38}" cy="${y-17}" r="7.5" fill="#c9962e"/><text x="${x+38}" y="${y-13.5}" text-anchor="middle" font-size="9" font-weight="700" fill="#2a2008">B</text>`;
    }
    if(opener && state.opp){
      s+=`<text x="${x}" y="${y+31}" text-anchor="middle" font-size="10.5" fill="${state.opp==="reg"?"var(--reg)":"var(--fish)"}">${state.opp==="reg"?"сильный рег":"любитель"}</text>`;
    }
  }
  s+=`</svg>`;
  document.getElementById("tableSvg").innerHTML=s;
}

/* ---------- answer ---------- */
function answer(a){
  if(state.answered) return;
  state.answered=true;
  const [t,b]=pair(state.k,state.i,state.j);
  const raw=[...new Set([t,b])];
  const ok_set=expand(raw,state.opp);
  const ok=ok_set.includes(a);
  const hn=handName(state.i,state.j);
  const m=CH[state.k];
  stats.n++; if(ok) stats.ok++;
  stats.mode[mode]=stats.mode[mode]||{n:0,ok:0}; stats.mode[mode].n++; if(ok) stats.mode[mode].ok++;
  stats.by[state.k]=stats.by[state.k]||{n:0,ok:0}; stats.by[state.k].n++; if(ok) stats.by[state.k].ok++;
  save(); haptic(ok?"success":"error");
  const lbl=x=>x==="R"?raiseLabel(state.k):ALABEL[x];
  const right=ok_set.map(lbl).join(" или ");
  let msg = ok ? `<b>Верно.</b> ${hn} — ${right.toLowerCase()}.`
               : `<b>Ошибка.</b> ${hn} — по чарту ${right.toLowerCase()}, ты выбрал «${lbl(a)}».`;
  if(raw.length>1) msg+=`<div class="note">Ячейка закрашена наполовину: обе опции по ожиданию почти равны, выбор зависит от оппонента и динамики. Засчитываются оба ответа.</div>`;
  if(raw.includes("K")) msg+=`<div class="note">Оранжевая ячейка — колл только против любителя. Против рега эта рука уходит в фолд.</div>`;
  if(raw.includes("G")) msg+=`<div class="note">Оливковая ячейка — фолд против сильного рега. Против остальных играем эту руку.</div>`;
  const v=document.getElementById("verdict"); v.className="verdict "+(ok?"ok":"no"); v.innerHTML=msg;
  drawGrid();
  document.getElementById("gridBox").classList.remove("hidden");
  document.getElementById("acts").innerHTML=`<button class="b-next" id="next">Следующая рука</button>`;
  document.getElementById("next").onclick=newSpot;
  drawStats();
}
function col(L){ return L==="P"?"var(--push)":L==="R"?"var(--raise)":L==="C"?"var(--call)":
  L==="G"?"var(--reg)":L==="K"?"var(--fish)":"var(--fold)"; }
function drawGrid(){
  let h="";
  for(let i=0;i<13;i++)for(let j=0;j<13;j++){
    const [t,b]=pair(state.k,i,j);
    const bg = t===b? col(t) : `linear-gradient(180deg,${col(t)} 50%,${col(b)} 50%)`;
    h+=`<div class="g${i===state.i&&j===state.j?" me":""}" style="background:${bg}">${handName(i,j)}</div>`;
  }
  document.getElementById("grid").innerHTML=h;
  const g=CH[state.k].g; let L=[];
  if(g.indexOf("P")>=0) L.push(["var(--push)","Пуш"]);
  if(g.indexOf("R")>=0) L.push(["var(--raise)",raiseLabel(state.k)]);
  if(g.indexOf("C")>=0) L.push(["var(--call)","Колл"]);
  if(g.indexOf("K")>=0) L.push(["var(--fish)","Колл против любителя"]);
  if(g.indexOf("G")>=0) L.push(["var(--reg)","Фолд против сильного рега"]);
  L.push(["var(--fold)","Фолд"]);
  document.getElementById("legend").innerHTML=L.map(x=>`<span><i style="background:${x[0]}"></i>${x[1]}</span>`).join("");
}
function drawStats(){
  const s=stats.mode[mode];
  document.getElementById("acc").textContent = s&&s.n? Math.round(100*s.ok/s.n)+"%":"—";
  document.getElementById("cnt").textContent = s?s.n:0;
  const rows=Object.entries(stats.by).filter(([k])=>CH[k]&&CH[k].mode===mode)
    .sort((a,b)=>(a[1].ok/a[1].n)-(b[1].ok/b[1].n));
  let h=`<tr><th>Спот</th><th class="n">Рук</th><th class="n">Точность</th></tr>`;
  rows.forEach(([k,v])=>{
    const c=CH[k]; const name=c.vs? `${c.hero} vs ${c.vs}, ${c.stack}bb` : `${c.hero}, ${c.model.split("·")[0]}`;
    h+=`<tr><td>${name}</td><td class="n">${v.n}</td><td class="n">${Math.round(100*v.ok/v.n)}%</td></tr>`;
  });
  if(!rows.length) h+=`<tr><td colspan="3" class="muted">Пока нет данных</td></tr>`;
  document.getElementById("statTable").innerHTML=h;
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(document.getElementById("screen-play").classList.contains("hidden")) return;
  if(state && state.answered && (e.key===" "||e.key==="Enter")){ e.preventDefault(); newSpot(); return; }
  const btns=[...document.getElementById("acts").children];
  const n=parseInt(e.key,10);
  if(n>=1&&n<=btns.length && btns[n-1].dataset.a){ btns[n-1].click(); }
});

/* ---------- telegram ---------- */
const TG=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
function haptic(k){ if(TG&&TG.HapticFeedback){try{TG.HapticFeedback.notificationOccurred(k);}catch(e){}} }
function cloudSave(o){ if(TG&&TG.CloudStorage&&TG.CloudStorage.setItem){try{TG.CloudStorage.setItem("notime",JSON.stringify(o),()=>{});}catch(e){}} }
if(TG){ try{ TG.ready(); TG.expand(); if(TG.setHeaderColor)TG.setHeaderColor("#12151a"); if(TG.setBackgroundColor)TG.setBackgroundColor("#12151a"); }catch(e){} 
  if(TG.CloudStorage&&TG.CloudStorage.getItem){ try{ TG.CloudStorage.getItem("notime",(err,val)=>{ if(!err&&val){ try{ const r=JSON.parse(val); if(r.n>stats.n){ stats=r; drawMenu(); } }catch(e){} } }); }catch(e){} }
}

document.getElementById("backMenu").onclick=()=>{drawMenu();show("menu");};
document.getElementById("backSetup").onclick=()=>{drawMenu();openSetup(mode);};
document.getElementById("startBtn").onclick=()=>{buildPool();show("play");newSpot();};
document.getElementById("resetAll").onclick=()=>{stats={n:0,ok:0,by:{},mode:{}};save();drawMenu();};
drawMenu(); show("menu");
</script>
